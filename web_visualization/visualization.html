<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Game Visualization</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #game-info { margin-bottom: 20px; }
        .hidden { display: none; }
        .trick { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .card {
            display: flex; /* Use flexbox for centering content */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            padding: 8px;
            margin: 5px;
            width: 100px; /* Even bigger width for cards */
            height: 150px; /* Even bigger height for cards */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 0.9em;
            text-align: center;
            color: white;
            font-weight: bold;
            overflow: hidden; /* Hide overflow if image is larger */
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Scale image down to fit, maintaining aspect ratio */
        }
        .card-rank { font-size: 1.2em; }
        .card-suit { font-size: 0.8em; }

        #game-info ul li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        #game-info p {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .card-display-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        #trick-navigation {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #trick-navigation button {
            padding: 8px 15px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tarot Game Visualization</h1>
    <input type="file" id="fileInput" accept=".json">
    <button onclick="loadGame()">Load Game</button>
    <button onclick="toggleGameInfo()">Toggle Game Setup Info</button>
    <div id="game-info" class="hidden"></div>

    <div id="trick-navigation">
        <button onclick="prevTrick()">Previous Trick</button>
        <span id="current-trick-display"></span>
        <button onclick="nextTrick()">Next Trick</button>
    </div>

    <div id="current-trick-container"></div>

    <hr>

    <h2>Current Trick Play</h2>
    <div id="play-navigation">
        <button onclick="prevPlay()">Previous Play</button>
        <span id="current-play-display"></span>
        <button onclick="nextPlay()">Next Play</button>
    </div>

    <div id="trick-table-cards">
        <h3>Cards on Table:</h3>
        <div id="cards-on-table" style="display: flex; flex-wrap: wrap;"></div>
    </div>

    <div id="current-player-info">
        <h3>Current Player: <span id="current-player-name"></span></h3>
        <h4>Card Played:</h4>
        <div id="card-played-by-current-player" style="display: flex;"></div>
        <h4>Player's Hand (before play):</h4>
        <div id="current-player-hand" style="display: flex; flex-wrap: wrap;"></div>
    </div>

    <script src="game_visualizer.js"></script>
    <script src="visualization.js"></script>
</body>
</html>
